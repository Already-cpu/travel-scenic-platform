server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: travel-website-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travel_website?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.travel.entity
  configuration:
    map-underscore-to-camel-case: true

travel:
  jwt-secret: ${TRAVEL_JWT_SECRET:change-this-jwt-secret-in-production}
  jwt-expiration: 86400000

logging:
  level:
    com.example.travel: info
